name: test

on: push

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: mamba-org/setup-micromamba@v2
      with:
        # Runtime and build requirements are shared with local source builds.
        environment-file: environment-dev.yml
        environment-name: test-env
        # Valgrind is used only by the Linux CI memory-safety checks.
        create-args: >-
          valgrind

    - name: Install glibc debug symbols for valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libc6-dbg binutils

    - name: configure cmake
      shell: bash -el {0}
      run: |
        export CC="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
        export CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
        export FC="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gfortran"
        python --version
        "$CC" --version
        "$CXX" --version
        "$FC" --version
        cmake -B "${{github.workspace}}/build" \
          -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" \
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_Fortran_COMPILER="$FC"

    - name: build fortran
      shell: bash -el {0}
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: test fortran memory safety
      shell: bash -el {0}
      working-directory: ${{github.workspace}}/build
      run: |
        valgrind --error-exitcode=1 --leak-check=full ./tests/clima/test_adiabat
        valgrind --error-exitcode=1 --leak-check=full ./tests/clima/test_radtran
        valgrind --error-exitcode=1 --leak-check=full ./tests/equilibrate/test_equilibrate
        valgrind --error-exitcode=1 --leak-check=full ./tests/photochem/test_api
        valgrind --error-exitcode=1 --leak-check=full ./tests/photochem/test_memory

    - name: test fortran correctness
      shell: bash -el {0}
      working-directory: ${{github.workspace}}/build
      run: |
        ./tests/clima/test_adiabat
        ./tests/clima/test_radtran
        ./tests/equilibrate/test_equilibrate
        ./tests/photochem/test_api
        ./tests/photochem/test_input
        ./tests/photochem/test_jacobian
        ./tests/photochem/test_production_loss

    - name: build python
      shell: bash -el {0}
      run: |
        export CMAKE_ARGS="\
          -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
          -DCMAKE_C_COMPILER=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc \
          -DCMAKE_CXX_COMPILER=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++ \
          -DCMAKE_Fortran_COMPILER=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gfortran"
        python -m build --no-isolation
        python -m pip install --no-deps --force-reinstall dist/*.whl

    - name: test python runtime
      shell: bash -el {0}
      working-directory: ${{github.workspace}}/tests/photochem
      run: |
        python test_python.py
        python ../clima/test_python.py
        python ../equilibrate/test_python.py

    - name: check shared libs for executable stack
      shell: bash -el {0}
      run: |
        set -euo pipefail
        shopt -s nullglob
        libs=("$CONDA_PREFIX"/lib/python*/site-packages/photochem/*.so)
        if [ ${#libs[@]} -eq 0 ]; then
          echo "No photochem shared libraries found under site-packages."
          exit 1
        fi
        bad=0
        for lib in "${libs[@]}"; do
          if readelf -W -l "$lib" | awk '
            /GNU_STACK/ && $0 ~ /E/ { found=1 }
            END { exit(found ? 0 : 1) }'
          then
            echo "ERROR: executable stack detected: $lib"
            bad=1
          else
            echo "OK: non-executable stack: $lib"
          fi
        done
        if [ "$bad" -ne 0 ]; then
          exit 1
        fi

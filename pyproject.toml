[build-system]
requires = ["scikit-build-core>=1.0", "numpy", "cython", "fypp"]
build-backend = "scikit_build_core.build"

[project]
name = "photochem"
dynamic = ["version"]
description = "Photochemical model of planet's atmospheres."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Nicholas Wogan", email = "nicholaswogan@gmail.com" },
]
dependencies = [
  "numpy",
  "scipy",
  "pyyaml",
  "numba",
  "h5py",
  "astropy",
  "threadpoolctl",
  "requests",
]

[project.urls]
Homepage = "https://github.com/Nicholaswogan/Photochem"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = '''project\(Photochem LANGUAGES Fortran C VERSION "(?P<value>[^"]+)"\)'''

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
wheel.packages = ["photochem"]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_PHOTOCHEM = true
BUILD_EXECUTABLES = false
BUILD_WITH_OPENMP = true
CMAKE_POSITION_INDEPENDENT_CODE = true

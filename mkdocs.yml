site_name: Photochem
site_description: One-dimensional photochemical, climate, and chemical-equilibrium models for planetary atmospheres
site_url: https://nicholaswogan.github.io/photochem/
repo_url: https://github.com/Nicholaswogan/photochem
repo_name: Nicholaswogan/photochem

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials: tutorials/index.md
  - Input Files: input-files/index.md
  - API Reference:
      - Overview: reference/index.md
      - Photochem: reference/photochem.md
      - Gas-Giant Extension: reference/gas-giants.md
      - Clima: reference/clima.md
      - Equilibrate: reference/equilibrate.md
      - Utilities: reference/utilities.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            allow_inspection: true
            docstring_style: numpy
            filters:
              - "!^_"
            line_length: 60
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_object_full_path: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
  - mkdocs-jupyter:
      include:
        - tutorials/*.py
      execute: true
      allow_errors: false
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
